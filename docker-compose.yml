version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lifeos-db
    environment:
      POSTGRES_DB: lifeos_db
      POSTGRES_USER: lifeos_user
      POSTGRES_PASSWORD: lifeos_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos_user -d lifeos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeos-backend
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lifeos_db
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: lifeos_user
      SPRING_DATASOURCE_PASSWORD: lifeos_password
      JWT_SECRET: this_is_my_secret_key_for_lifeos_project_use_it_carefully_12345
      CORS_ALLOWED_ORIGINS: http://localhost:4005,http://localhost:4200,http://localhost:4000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeos-frontend
    ports:
      - "4005:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
