# Application configuration
spring.application.name=lifeos-backend
server.port=8085

# Database configuration (H2 in-memory fallback for local dev, PostgreSQL for production/docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifeosdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# JWT configuration
jwt.secret=${JWT_SECRET:this_is_my_secret_key_for_lifeos_project_use_it_carefully_12345}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4005,http://localhost:4200,http://localhost:4000,http://localhost:8085}

# Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
